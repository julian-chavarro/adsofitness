{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ADSO Fitness</title>
    

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 30px;
        }
        header h1 {
            font-size: 3em;
            margin: 0;
        }
        .logo {
            margin-top: 30px;
        }
        .logo img {
            width: 200px;
        }
        .boton {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 25px;
            font-size: 1.2em;
            color: white;
            background: #27ae60;
            text-decoration: none;
            border-radius: 10px;
        }
        .boton:hover {
            background: #2ecc71;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenido a ADSO Fitness</h1>
        <p>Tu app de rutinas y ejercicios para principiantes</p>
    </header>

    <div class="logo">
        <img src="{% static 'img/logo.png' %}" alt="Logo ADSO Fitness" class="img-fluid" style="max-width: 300px;">
    </div>

    <a class="boton" href="{% url 'lista_ejercicios' %}">Ver Ejercicios</a>
</body>
</html>
